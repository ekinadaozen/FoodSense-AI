# ============================================
# FoodSense AI - Application Configuration
# ============================================

spring:
  application:
    name: foodsense-ai

  # ── PostgreSQL DataSource ──────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/foodsense_db
    username: foodsense
    password: foodsense_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate ────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ── Apache Kafka ───────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: foodsense-ai-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true

# ── Kafka Topic ──────────────────────────────
kafka:
  topic:
    complaint: complaint-topic

# ── Google Gemini API ────────────────────────
gemini:
  api:
    key: ${GEMINI_API_KEY:your-gemini-api-key-here}
    model: gemini-2.0-flash
    base-url: https://generativelanguage.googleapis.com

# ── Server Configuration ─────────────────────
server:
  port: 8080

# ── OpenAPI / Swagger ────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── Logging ──────────────────────────────────
logging:
  level:
    root: INFO
    com.foodsense.ai: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
